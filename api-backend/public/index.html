<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <title>Add Product</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

    <div class="container py-5">

        <!-- Page Heading -->
        <div class="mb-4">
            <h2 class="fw-bold mb-1">Add Product</h2>
            <p class="text-secondary mb-0">
                Add product details and upload product images.
            </p>
        </div>

        <!-- Product Form -->
        <div class="card border-0 shadow-sm rounded-4">

            <div class="card-body p-4 p-lg-5">

                <form action="/api/v1/products" method="POST" enctype="multipart/form-data">
                    <div class="row g-5">

                        <!-- ========================= -->
                        <!-- LEFT SIDE - PRODUCT DATA -->
                        <!-- ========================= -->
                        <div class="col-lg-7">

                            <h5 class="fw-semibold mb-4">
                                Product Information
                            </h5>

                            <!-- Title -->
                            <div class="mb-4">
                                <label for="title" class="form-label fw-semibold">
                                    Product Title
                                </label>

                                <input type="text" class="form-control form-control-lg" id="title" name="title"
                                    placeholder="Enter product title" required>
                            </div>

                            <!-- Price + Category -->
                            <div class="row g-3 mb-4">

                                <div class="col-md-6">

                                    <label for="price" class="form-label fw-semibold">
                                        Price
                                    </label>

                                    <div class="input-group input-group-lg">

                                        <span class="input-group-text">
                                            ₹
                                        </span>

                                        <input type="number" class="form-control" id="price" name="price"
                                            placeholder="0.00" min="0" step="0.01" required>

                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label for="category" class="form-label fw-semibold">
                                        Category
                                    </label>

                                    <select class="form-select form-select-lg" id="category" name="category" required>
                                        <option value="" selected disabled>
                                            Select category
                                        </option>

                                        <option value="electronics">
                                            Electronics
                                        </option>

                                        <option value="clothing">
                                            Clothing
                                        </option>

                                        <option value="books">
                                            Books
                                        </option>

                                        <option value="home">
                                            Home
                                        </option>

                                        <option value="sports">
                                            Sports
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <!-- Description -->
                            <div class="mb-4">

                                <label for="description" class="form-label fw-semibold">
                                    Description
                                </label>

                                <textarea class="form-control" id="description" name="description" rows="6"
                                    placeholder="Enter product description" required></textarea>

                            </div>

                            <!-- Rating -->
                            <div class="mb-4">

                                <h6 class="fw-semibold mb-3">
                                    Rating
                                </h6>

                                <div class="row g-3">

                                    <!-- Rating Rate -->
                                    <div class="col-md-6">

                                        <label for="ratingRate" class="form-label">
                                            Rating
                                        </label>

                                        <input type="number" class="form-control" id="ratingRate" name="rating[rate]"
                                            min="0" max="5" step="0.1" placeholder="e.g. 4.5">

                                        <div class="form-text">
                                            Rating between 0 and 5.
                                        </div>

                                    </div>

                                    <!-- Rating Count -->
                                    <div class="col-md-6">

                                        <label for="ratingCount" class="form-label">
                                            Rating Count
                                        </label>

                                        <input type="number" class="form-control" id="ratingCount" name="rating[count]"
                                            min="0" placeholder="e.g. 120">

                                    </div>

                                </div>

                            </div>

                        </div>


                        <!-- ========================= -->
                        <!-- RIGHT SIDE - IMAGE UPLOAD -->
                        <!-- ========================= -->
                        <div class="col-lg-5">

                            <h5 class="fw-semibold mb-4">
                                Product Images
                            </h5>

                            <div class="border rounded-4 p-4 text-center bg-dark">

                                <!-- Upload Icon -->
                                <div class="mx-auto mb-4 d-flex align-items-center justify-content-center bg-primary bg-opacity-10 rounded-circle"
                                    style="width: 80px; height: 80px;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" fill="currentColor"
                                        class="text-primary" viewBox="0 0 16 16">
                                        <path
                                            d="M.5 9.9a.5.5 0 0 1 .5.5v2.1a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.1a.5.5 0 0 1 1 0v2.1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.1a.5.5 0 0 1 .5-.5z" />

                                        <path
                                            d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V10.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z" />
                                    </svg>
                                </div>

                                <!-- Main Text -->
                                <h5 class="fw-semibold">
                                    Upload Product Images
                                </h5>

                                <p class="text-secondary mb-4">
                                    Add one or more images of your product.
                                </p>

                                <!-- File Input -->
                                <div class="mb-3">

                                    <label for="images" class="btn btn-primary btn-lg px-4 rounded-pill">
                                        Upload Image
                                    </label>

                                    <input type="file" class="d-none" id="images" name="images"
                                        accept="image/jpeg,image/png,image/webp" multiple>

                                </div>

                                <p class="text-secondary mb-1">
                                    or drop a file
                                </p>

                                <small class="text-secondary">
                                    PNG, JPG or WEBP
                                </small>

                                <div class="mt-3">

                                    <small class="text-secondary">
                                        Maximum 5 images
                                    </small>

                                </div>

                            </div>


                            <!-- Selected Files -->
                            <div class="mt-4">

                                <h6 class="fw-semibold mb-3">
                                    Selected Images
                                </h6>

                                <div id="imagePreview" class="row row-cols-2 g-3">
                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- ========================= -->
                    <!-- FORM ACTIONS -->
                    <!-- ========================= -->

                    <hr class="my-5">

                    <div class="d-flex justify-content-end gap-2">

                        <button type="reset" class="btn btn-outline-secondary px-4">
                            Cancel
                        </button>

                        <button type="submit" class="btn btn-primary px-4">
                            Add Product
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script>

        const imageInput = document.getElementById("images");
        const imagePreview = document.getElementById("imagePreview");

        imageInput.addEventListener("change", function () {

            imagePreview.innerHTML = "";

            const files = Array.from(this.files);

            files.slice(0, 5).forEach((file) => {

                const reader = new FileReader();

                reader.onload = function (event) {

                    const col = document.createElement("div");

                    col.className = "col";

                    col.innerHTML = `
                    <div class="card border-0 shadow-sm">

                        <img
                            src="${event.target.result}"
                            class="card-img-top rounded-3"
                            style="height: 130px; object-fit: cover;"
                            alt="Product Image"
                        >

                        <div class="card-body p-2">

                            <small
                                class="text-secondary text-truncate d-block"
                                title="${file.name}"
                            >
                                ${file.name}
                            </small>

                        </div>

                    </div>
                `;

                    imagePreview.appendChild(col);
                };

                reader.readAsDataURL(file);
            });

        });

    </script>

</body>

</html>
